name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable unprivileged userfaultfd
        run: sudo sysctl -w vm.unprivileged_userfaultfd=1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Integration test
        run: |
          cargo build
          printf 'Hello, smugmap! 0123456789abcdef' > /tmp/smugmap-test-data.bin
          python3 test/serve.py 8787 &
          sleep 0.3
          printf '[{"pattern":"*.bin","url":"http://127.0.0.1:8787/tmp/smugmap-test-data.bin"}]' \
            > /tmp/smugmap-test.json
          SMUGMAP_CONFIG=/tmp/smugmap-test.json \
            LD_PRELOAD=target/debug/libsmugmap.so \
            target/debug/selfcheck
